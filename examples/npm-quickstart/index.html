<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AillomVox npm quickstart</title>
  </head>
  <body>
    <main id="app">
      <section class="shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">aillom-vox-client</p>
            <h1>Test Vox from npm</h1>
          </div>
          <div class="status-pill" id="statusPill">offline</div>
        </header>

        <section class="workspace">
          <form class="panel controls" id="sessionForm">
            <label class="field field-wide">
              <span>API key</span>
              <input id="apiKey" type="password" placeholder="av_..." autocomplete="off" />
            </label>

            <label class="field">
              <span>Provider</span>
              <select id="provider">
                <option value="aillomvox">Loading providers...</option>
              </select>
            </label>

            <label class="field" id="ttsField">
              <span>TTS engine</span>
              <select id="ttsEngine">
                <option value="inworld">Loading engines...</option>
              </select>
            </label>

            <label class="field">
              <span>Voice</span>
              <select id="voice">
                <option value="Aanya">Aanya</option>
              </select>
            </label>

            <label class="field">
              <span>Language</span>
              <select id="language">
                <option value="en-US">en-US</option>
                <option value="pt-BR">pt-BR</option>
                <option value="es-ES">es-ES</option>
              </select>
            </label>

            <label class="field">
              <span>Sample rate</span>
              <select id="sampleRate">
                <option value="16000">16000 Hz</option>
                <option value="24000">24000 Hz</option>
                <option value="8000">8000 Hz</option>
              </select>
            </label>

            <label class="field field-wide">
              <span>Prompt</span>
              <textarea id="systemPrompt" rows="3">You are a concise, natural and helpful voice assistant. Reply in English unless the user asks for another language.</textarea>
            </label>

            <div class="button-row">
              <button type="button" class="button secondary" id="catalogButton">Refresh catalog</button>
              <button type="submit" class="button primary" id="startButton">Start call</button>
              <button type="button" class="button danger" id="stopButton" disabled>End call</button>
            </div>
          </form>

          <section class="panel live">
            <div class="meter-strip">
              <div>
                <span class="metric-label">State</span>
                <strong id="stateText">ready</strong>
              </div>
              <div>
                <span class="metric-label">Audio</span>
                <strong id="audioText">idle</strong>
              </div>
              <div>
                <span class="metric-label">Packets</span>
                <strong id="chunkCount">0</strong>
              </div>
            </div>

            <div class="composer">
              <input id="textInput" type="text" placeholder="Send text to the session" />
              <button type="button" class="button secondary" id="sendTextButton" disabled>Send</button>
            </div>

            <div class="transcript" id="transcript">
              <p class="empty">Transcripts appear here.</p>
            </div>

            <div class="log" id="eventLog" aria-live="polite"></div>
          </section>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
